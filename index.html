<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<script>/* arcAId theme: light by default, remembered per browser */try{var _t=localStorage.getItem("gmh:theme2");document.documentElement.setAttribute("data-arcade-theme",_t==="dark"?"dark":"light");}catch(e){document.documentElement.setAttribute("data-arcade-theme","light");}</script>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>שובר לבנים · arcAId</title>

<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#f4f0ff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="שובר לבנים">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<script src="https://gilmagnum.github.io/games/config.js?v=4"></script>
<script src="https://gilmagnum.github.io/games/leaderboard.js?v=4"></script>

<style>
  :root{
    --bg:#f4f0ff; --panel:#ffffff; --text:#1c1730; --muted:#726b95;
    --accent:#7c5cff; --accent2:#ff5ca8; --brick-shadow:rgba(20,10,50,.18);
    --paddle:#1c1730; --ball:#ff5ca8; --good:#33c37e; --bad:#ff5c5c;
    --bar-bg:rgba(255,255,255,.92); --bar-border:rgba(20,10,50,.08);
  }
  html[data-arcade-theme="dark"]{
    --bg:#0b0d1c; --panel:#161a30; --text:#f0eefc; --muted:#9a94c2;
    --accent:#9b82ff; --accent2:#ff7cbd; --brick-shadow:rgba(0,0,0,.5);
    --paddle:#f0eefc; --ball:#ff7cbd; --good:#4fe0a0; --bad:#ff7c7c;
    --bar-bg:rgba(22,26,48,.92); --bar-border:rgba(255,255,255,.08);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; height:100%; background:var(--bg); color:var(--text);
    font-family:'Segoe UI',Arial,sans-serif; overscroll-behavior:none; touch-action:none;
    transition:background .25s, color .25s;
  }
  #app{
    display:flex; flex-direction:column; align-items:center;
    height:calc(100dvh - env(safe-area-inset-bottom,0px));
    height:100dvh;
    padding:8px 8px calc(64px + env(safe-area-inset-bottom,0px));
    max-width:560px; margin:0 auto; position:relative;
  }
  header{
    width:100%; display:flex; align-items:center; justify-content:space-between;
    padding:6px 6px 4px; flex-shrink:0;
  }
  header a{ color:var(--muted); text-decoration:none; font-size:13px; }
  header .brand{ font-weight:800; font-size:15px; letter-spacing:.2px; }
  header .brand span{ color:var(--accent); }

  .hud{
    width:100%; display:flex; justify-content:space-between; gap:8px;
    padding:2px 4px 8px; flex-shrink:0;
  }
  .hud .stat{
    background:var(--panel); border-radius:12px; padding:6px 12px;
    text-align:center; box-shadow:0 2px 10px var(--brick-shadow); flex:1;
  }
  .hud .stat b{ display:block; font-size:17px; white-space:nowrap; }
  #hLives{ font-size:14px; letter-spacing:-2px; }
  .hud .stat span{ font-size:10px; color:var(--muted); }

  #stage-wrap{
    position:relative; width:100%; flex:1; min-height:0;
    display:flex; align-items:center; justify-content:center;
  }
  #stage{
    background:var(--panel); border-radius:16px; box-shadow:0 6px 24px var(--brick-shadow);
    max-width:100%; max-height:100%; touch-action:none; display:block;
  }

  /* the overlays sit exactly on the board, not on the empty space beside it */
  .overlay{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:var(--stage-w,100%); height:var(--stage-h,100%);
    border-radius:16px; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:14px; text-align:center;
    background:rgba(20,15,40,.55); backdrop-filter:blur(3px); color:#fff; padding:20px;
  }
  .overlay.hidden{ display:none; }
  .overlay h2{ margin:0; font-size:22px; }
  .overlay p{ margin:0; font-size:14px; opacity:.85; max-width:280px; }
  .overlay .big-btn{
    background:var(--accent); color:#fff; border:none; border-radius:14px;
    padding:12px 28px; font-size:16px; font-weight:700; cursor:pointer;
  }
  .overlay .ghost-btn{
    background:transparent; color:#fff; border:1px solid rgba(255,255,255,.5);
    border-radius:14px; padding:9px 22px; font-size:13px; cursor:pointer;
  }

  .toast{
    position:absolute; top:10px; left:50%; transform:translateX(-50%);
    background:var(--accent); color:#fff; padding:6px 16px; border-radius:20px;
    font-size:12px; font-weight:700; opacity:0; pointer-events:none; transition:opacity .2s, top .2s;
    white-space:nowrap; z-index:10;
  }
  .toast.show{ opacity:1; top:18px; }

  .buffbar{
    position:absolute; top:10px; right:10px; z-index:9;
    display:flex; flex-direction:column; gap:5px; align-items:flex-end;
  }
  .buffbar .buff{
    background:var(--panel); box-shadow:0 2px 8px var(--brick-shadow);
    border-radius:20px; padding:4px 10px; font-size:12px; font-weight:800;
    display:flex; align-items:center; gap:6px; color:var(--text);
    animation:buffpop .15s ease-out;
  }
  .buffbar .buff .ico{ font-size:13px; line-height:1; }
  .buffbar .buff .secs{ min-width:20px; text-align:center; }
  .buffbar .buff .bar{
    width:26px; height:4px; border-radius:3px; background:var(--brick-shadow); overflow:hidden;
  }
  .buffbar .buff .bar i{ display:block; height:100%; background:var(--accent); }
  @keyframes buffpop{ from{ transform:scale(.7); opacity:0; } to{ transform:scale(1); opacity:1; } }

  @media (max-height:560px){
    header{ padding:2px 6px; }
    .hud{ padding:2px 4px 4px; }
    .hud .stat{ padding:3px 10px; }
    .hud .stat b{ font-size:14px; }
    .hud .stat span{ display:none; }
  }
  @media (orientation:landscape) and (max-height:460px){
    #app{ padding-bottom:54px; }
    header{ padding:1px 6px; }
    header a, header .brand{ font-size:12px; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <a href="https://gilmagnum.github.io/games/">← כל המשחקים</a>
    <div class="brand">שובר <span>AI</span> לבנים</div>
    <div style="width:60px"></div>
  </header>

  <div class="hud">
    <div class="stat"><b id="hScore">0</b><span>ניקוד</span></div>
    <div class="stat"><b id="hLevel">1</b><span>שלב</span></div>
    <div class="stat"><b id="hLives">🧡🧡🧡</b><span>חיים</span></div>
    <div class="stat"><b id="hBest">0</b><span>שיא אישי</span></div>
  </div>

  <div id="stage-wrap">
    <canvas id="stage"></canvas>
    <div class="toast" id="toast"></div>
    <div class="buffbar" id="buffBar"></div>

    <div class="overlay" id="ovStart">
      <h2>🧱 שובר לבנים</h2>
      <p>גררו או השתמשו בחצים כדי להזיז את המחבט. נפצו את כל הלבנים לפני שנגמרים לכם החיים. אספו כוחות־על שנופלים מהלבנים!</p>
      <button class="big-btn" id="btnStart">▶ התחלה</button>
    </div>

    <div class="overlay hidden" id="ovPause">
      <h2>⏸ הפסקה</h2>
      <button class="big-btn" id="btnResume">המשך</button>
      <button class="ghost-btn" id="btnRestartFromPause">התחלה מחדש</button>
    </div>

    <div class="overlay hidden" id="ovLevel">
      <h2 id="lvTitle">שלב 2 🎉</h2>
      <p id="lvSub">מהירות עולה, בואו נמשיך!</p>
      <button class="big-btn" id="btnNextLevel">המשך</button>
    </div>

    <div class="overlay hidden" id="ovOver">
      <h2 id="overTitle">המשחק נגמר 💥</h2>
      <p id="overSub">ניקוד סופי: 0</p>
      <button class="big-btn" id="btnRetry">שחקו שוב</button>
      <button class="ghost-btn" id="btnShowBoard">🏆 טבלת שיאים</button>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";

/* ---------- setup ---------- */
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
const app = document.getElementById('app');
const stageWrap = document.getElementById('stage-wrap');

const ovStart = document.getElementById('ovStart');
const ovPause = document.getElementById('ovPause');
const ovLevel = document.getElementById('ovLevel');
const ovOver  = document.getElementById('ovOver');
const toastEl = document.getElementById('toast');
const buffBarEl = document.getElementById('buffBar');

const hScore = document.getElementById('hScore');
const hLevel = document.getElementById('hLevel');
const hLives = document.getElementById('hLives');
const hBest  = document.getElementById('hBest');

function isDarkTheme(){ return document.documentElement.getAttribute('data-arcade-theme') === 'dark'; }

/* ---------- leaderboard wiring ---------- */
const SLUG = 'brick-breaker';
let boardReady = false;
if (window.Leaderboard) {
  Leaderboard.init({ game: SLUG, title: 'שובר לבנים', scoreLabel: 'נקודות' });
  boardReady = true;
}
document.getElementById('btnShowBoard').addEventListener('click', () => {
  if (boardReady) Leaderboard.show();
  else document.getElementById('btnShowBoard').style.display = 'none';
});

const bestKey = 'bb_best_score';
function getBest(){ return Number(localStorage.getItem(bestKey) || 0); }
function setBest(v){ localStorage.setItem(bestKey, String(v)); }
hBest.textContent = getBest();

/* ---------- audio (tiny synth, no assets) ---------- */
let muted = !!(window.Arcade && Arcade.muted && Arcade.muted());
let actx = null;
function audioCtx(){ if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)(); return actx; }
function beep(freq, dur, type, vol){
  if (muted) return;
  try{
    const ac = audioCtx();
    const o = ac.createOscillator(); const g = ac.createGain();
    o.type = type || 'sine'; o.frequency.value = freq;
    g.gain.value = (vol||0.12);
    g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + (dur||0.12));
    o.connect(g); g.connect(ac.destination);
    o.start(); o.stop(ac.currentTime + (dur||0.12));
  }catch(e){}
}
const sfx = {
  wall:()=>beep(220,0.05,'triangle',0.08),
  paddle:()=>beep(330,0.07,'square',0.1),
  brick:(hard)=>beep(hard?520:700,0.08,'square',0.1),
  power:()=>beep(880,0.15,'sine',0.15),
  lose:()=>beep(140,0.35,'sawtooth',0.15),
  win:()=>{ beep(523,0.12,'sine',0.15); setTimeout(()=>beep(659,0.12,'sine',0.15),120); setTimeout(()=>beep(784,0.2,'sine',0.15),240); },
  over:()=>{ beep(300,0.2,'sawtooth',0.15); setTimeout(()=>beep(200,0.25,'sawtooth',0.15),180); setTimeout(()=>beep(120,0.4,'sawtooth',0.15),380); }
};

/* ---------- responsive canvas ---------- */
const GAME_W = 360, GAME_H = 540; // logical coordinate space
let dpr = Math.max(1, window.devicePixelRatio || 1);

function resizeCanvas(){
  const availW = stageWrap.clientWidth - 4;
  const availH = stageWrap.clientHeight - 4;
  let scale = Math.min(availW / GAME_W, availH / GAME_H);
  scale = Math.max(scale, 0.5);
  const cssW = GAME_W * scale, cssH = GAME_H * scale;
  canvas.style.width = cssW + 'px';
  canvas.style.height = cssH + 'px';
  stageWrap.style.setProperty('--stage-w', cssW + 'px');
  stageWrap.style.setProperty('--stage-h', cssH + 'px');
  canvas.width = Math.round(GAME_W * dpr);
  canvas.height = Math.round(GAME_H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resizeCanvas);
window.addEventListener('orientationchange', ()=>setTimeout(resizeCanvas,100));

/* ---------- game state ---------- */
const ROWS_BASE = 5, COLS = 8;
const BRICK_W = GAME_W / COLS;
const BRICK_H = 18;
const BRICK_TOP = 46;
const BRICK_GAP = 3;

const rowColors = ['#ff5c5c','#ff9c4a','#ffd23f','#33c37e','#4a9dff','#9b6bff','#ff5ca8'];

let state = 'idle'; // idle, playing, paused, levelup, over
let level = 1, score = 0, lives = 3;
let bricks = [];
let balls = [];
let powerups = [];
let particles = [];
let paddle = { w: 70, h: 12, x: GAME_W/2 - 35, y: GAME_H - 34, speed: 0 };
let basePaddleW = 70;
let widenTimer = 0, slowTimer = 0, gunTimer = 0, gunCooldown = 0, fireTimer = 0, trampolineTimer = 0, magnetTimer = 0;
let bullets = [];
let currentSpeed = 3;
let keys = { left:false, right:false };
let dragX = null;

function livesHearts(n){
  let s = ''; for(let i=0;i<n;i++) s += '🧡'; return s || '💔';
}

function newBallObj(x,y,vx,vy){
  return { x, y, vx, vy, r: 6 };
}

function buildLevel(lv){
  bricks = [];
  const rows = Math.min(ROWS_BASE + Math.floor((lv-1)/2), 9);
  for(let r=0;r<rows;r++){
    for(let c=0;c<COLS;c++){
      // sprinkle gaps at higher levels for variety
      if (lv > 2 && Math.random() < 0.08) continue;
      const hp = (lv > 3 && Math.random() < 0.18) ? 2 : 1; // tougher bricks later
      bricks.push({
        x: c*BRICK_W + BRICK_GAP/2, y: BRICK_TOP + r*(BRICK_H+BRICK_GAP),
        w: BRICK_W - BRICK_GAP, h: BRICK_H,
        hp, maxHp: hp, color: rowColors[r % rowColors.length], alive:true
      });
    }
  }
}

function resetPaddleAndBall(){
  basePaddleW = 70;
  paddle.w = basePaddleW;
  paddle.x = GAME_W/2 - paddle.w/2;
  paddle.y = GAME_H - 34;
  currentSpeed = 3.6 + (level-1)*0.4;
  const b = newBallObj(paddle.x + paddle.w/2, paddle.y - 10, 0, 0);
  b.stuck = true;
  balls = [ b ];
  powerups = [];
  bullets = [];
  widenTimer = 0; slowTimer = 0; gunTimer = 0; gunCooldown = 0; fireTimer = 0; trampolineTimer = 0; magnetTimer = 0;
}

function launchStuckBall(b){
  b.stuck = false;
  const angle = (Math.random()*0.5 - 0.25);
  b.vx = currentSpeed * Math.sin(angle);
  b.vy = -currentSpeed * Math.cos(angle);
}

function startGame(){
  if (window.Leaderboard && Leaderboard.cancelPending) Leaderboard.cancelPending();   // a new round drops the old run's panel
  if (window.Arcade) Arcade.setPaused(false);                                          // a fresh round is never paused
  autoPaused = false;
  level = 1; score = 0; lives = 3;
  buildLevel(level);
  resetPaddleAndBall();
  state = 'playing';
  updateHud();
  ovStart.classList.add('hidden');
  ovOver.classList.add('hidden');
  ovLevel.classList.add('hidden');
  ovPause.classList.add('hidden');
}

function restartGame(){
  ovPause.classList.add('hidden');
  ovOver.classList.add('hidden');
  startGame();
}

function updateHud(){
  hScore.textContent = score;
  hLevel.textContent = level;
  hLives.textContent = livesHearts(lives);
  hBest.textContent = Math.max(getBest(), score);
}

function addScore(pts){
  score += pts * level;
  updateHud();
}

function showToast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>toastEl.classList.remove('show'), 1200);
}

/* ---------- particles ---------- */
function spawnParticles(x,y,color){
  for(let i=0;i<8;i++){
    particles.push({
      x, y, vx:(Math.random()-0.5)*4, vy:(Math.random()-0.5)*4-1,
      life: 22, color
    });
  }
}
function updateParticles(){
  for(let i=particles.length-1;i>=0;i--){
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.12; p.life--;
    if (p.life<=0) particles.splice(i,1);
  }
}
function drawParticles(){
  particles.forEach(p=>{
    ctx.globalAlpha = Math.max(0, p.life/22);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x-2, p.y-2, 4, 4);
  });
  ctx.globalAlpha = 1;
}

/* ---------- powerups ---------- */
const POWER_TYPES = [
  { type:'wide', emoji:'↔️', color:'#33c37e', label:'מחבט רחב' },
  { type:'slow', emoji:'🐢', color:'#4a9dff', label:'כדור איטי' },
  { type:'multi', emoji:'✳️', color:'#ff5ca8', label:'כדור כפול' },
  { type:'life', emoji:'💗', color:'#ff5c5c', label:'חיים נוספים' },
  { type:'gun', emoji:'🔫', color:'#ffa64a', label:'תותח לבנים' },
  { type:'fire', emoji:'🔥', color:'#ff6b35', label:'כדור אש' },
  { type:'trampoline', emoji:'🛝', color:'#4ecdc4', label:'טרמפולינה' },
  { type:'magnet', emoji:'🧲', color:'#a78bfa', label:'מגנט' }
];
function maybeDropPower(x,y){
  if (Math.random() < 0.16){
    const pool = lives >= 3 ? POWER_TYPES.filter(t => t.type !== 'life') : POWER_TYPES;
    const t = pool[Math.floor(Math.random()*pool.length)];
    powerups.push({ x, y, vy:1.6, ...t });
  }
}
function applyPower(p){
  sfx.power();
  if (p.type === 'wide'){
    paddle.w = basePaddleW * 1.6;
    widenTimer = 10000;
    showToast('↔️ מחבט הורחב!');
  } else if (p.type === 'slow'){
    slowTimer = 10000;
    showToast('🐢 הכדור מואט!');
  } else if (p.type === 'multi'){
    const b = balls[0];
    if (b){
      const baseAngle = Math.atan2(-b.vy, b.vx); // current travel angle
      [baseAngle + 0.5, baseAngle - 0.5].forEach(a=>{
        balls.push(newBallObj(b.x, b.y, currentSpeed * Math.cos(a), -currentSpeed * Math.sin(a)));
      });
    }
    showToast('✳️ כדור כפול!');
  } else if (p.type === 'life'){
    lives = Math.min(3, lives + 1);
    showToast('💗 חיים נוספים!');
    updateHud();
  } else if (p.type === 'gun'){
    gunTimer = 10000;
    gunCooldown = 0;
    showToast(widenTimer > 0 ? '🔫 תותח כפול משני הקצוות!' : '🔫 תותח לבנים מופעל!');
  } else if (p.type === 'fire'){
    fireTimer = 10000;
    showToast('🔥 כדור אש — שורף דרך הלבנים!');
  } else if (p.type === 'trampoline'){
    trampolineTimer = 10000;
    showToast('🛝 טרמפולינה — לא תפסלו!');
  } else if (p.type === 'magnet'){
    magnetTimer = 10000;
    showToast('🧲 מגנט — הכדור יידבק למחבט!');
  }
}

/* ---------- input ---------- */
function paddleTargetFromClientX(clientX){
  const rect = canvas.getBoundingClientRect();
  const relX = (clientX - rect.left) / rect.width * GAME_W;
  return relX - paddle.w/2;
}
canvas.addEventListener('pointerdown', e=>{
  if (state === 'idle'){ startGame(); return; }
  dragX = e.clientX;
  paddle.x = clamp(paddleTargetFromClientX(e.clientX), 0, GAME_W - paddle.w);
});
canvas.addEventListener('pointermove', e=>{
  if (dragX === null) return;
  paddle.x = clamp(paddleTargetFromClientX(e.clientX), 0, GAME_W - paddle.w);
});
window.addEventListener('pointerup', ()=>{
  const wasDragging = dragX !== null;   // a tap on the control bar must not fire the ball
  dragX = null;
  if (wasDragging && state === 'playing'){
    balls.filter(b=>b.stuck).forEach(launchStuckBall);
  }
});

window.addEventListener('keydown', e=>{
  if (e.key === 'ArrowLeft') keys.left = true;
  if (e.key === 'ArrowRight') keys.right = true;
  if (e.key === ' '){
    e.preventDefault();
    const stuckBalls = balls.filter(b=>b.stuck);
    if (stuckBalls.length && state === 'playing') stuckBalls.forEach(launchStuckBall);
    else togglePause();
  }
});
window.addEventListener('keyup', e=>{
  if (e.key === 'ArrowLeft') keys.left = false;
  if (e.key === 'ArrowRight') keys.right = false;
});

function clamp(v,min,max){ return Math.max(min, Math.min(max, v)); }

/* ---------- arcAId shared control bar ---------- */
if (window.Arcade) {
  Arcade.controls({
    onPause:   function () { if (state === 'playing'){ state = 'paused'; ovPause.classList.remove('hidden'); } },
    onResume:  function () { if (state === 'paused'){ state = 'playing'; ovPause.classList.add('hidden'); } },
    onRestart: function () { restartGame(); },
    onMute:    function (m) { muted = !!m; },
    theme: true
  });
}
document.getElementById('btnStart').addEventListener('click', startGame);
document.getElementById('btnResume').addEventListener('click', togglePause);
document.getElementById('btnRestartFromPause').addEventListener('click', restartGame);
document.getElementById('btnRetry').addEventListener('click', restartGame);
document.getElementById('btnNextLevel').addEventListener('click', ()=>{
  ovLevel.classList.add('hidden');
  state = 'playing';
});

function togglePause(){
  if (state === 'playing'){ state = 'paused'; ovPause.classList.remove('hidden'); if (window.Arcade) Arcade.setPaused(true); }
  else if (state === 'paused'){ state = 'playing'; ovPause.classList.add('hidden'); if (window.Arcade) Arcade.setPaused(false); }
}

// a tab switch pauses the round; only an auto-pause is undone on the way back
let autoPaused = false;
document.addEventListener('visibilitychange', () => {
  if (document.hidden){
    if (state === 'playing'){ autoPaused = true; state = 'paused'; ovPause.classList.remove('hidden'); if (window.Arcade) Arcade.setPaused(true); }
  } else if (autoPaused){
    autoPaused = false;
    if (state === 'paused'){ state = 'playing'; ovPause.classList.add('hidden'); if (window.Arcade) Arcade.setPaused(false); }
  }
});

/* ---------- collisions ---------- */
function ballBrickCollide(b, br){
  return b.x + b.r > br.x && b.x - b.r < br.x + br.w &&
         b.y + b.r > br.y && b.y - b.r < br.y + br.h;
}

function resolveBrickHit(b, br){
  // determine side of impact via overlap depth
  const overlapLeft = (b.x + b.r) - br.x;
  const overlapRight = (br.x + br.w) - (b.x - b.r);
  const overlapTop = (b.y + b.r) - br.y;
  const overlapBottom = (br.y + br.h) - (b.y - b.r);
  const minOverlap = Math.min(overlapLeft, overlapRight, overlapTop, overlapBottom);
  if (minOverlap === overlapTop || minOverlap === overlapBottom) b.vy *= -1;
  else b.vx *= -1;
}

/* ---------- game loop ---------- */
let lastTs = null;
function loop(ts){
  if (lastTs === null) lastTs = ts;
  const dt = Math.min(ts - lastTs, 50); // clamp to avoid huge jumps on tab-switch
  lastTs = ts;
  if (state === 'playing'){
    update(dt);
  }
  render();
  requestAnimationFrame(loop);
}

function update(dt){
  // paddle keyboard
  const pSpeed = 6.5;
  if (keys.left) paddle.x -= pSpeed;
  if (keys.right) paddle.x += pSpeed;
  paddle.x = clamp(paddle.x, 0, GAME_W - paddle.w);

  if (widenTimer > 0){ widenTimer = Math.max(0, widenTimer - dt); if (widenTimer===0) paddle.w = basePaddleW; }
  const speedMul = slowTimer > 0 ? 0.6 : 1;
  if (slowTimer > 0) slowTimer = Math.max(0, slowTimer - dt);
  if (fireTimer > 0) fireTimer = Math.max(0, fireTimer - dt);
  if (trampolineTimer > 0) trampolineTimer = Math.max(0, trampolineTimer - dt);
  if (magnetTimer > 0) magnetTimer = Math.max(0, magnetTimer - dt);

  // balls
  const stuckList = balls.filter(bb=>bb.stuck);
  for (let i = balls.length-1; i>=0; i--){
    const b = balls[i];
    if (b.stuck){
      const idx = stuckList.indexOf(b);
      const spread = (idx - (stuckList.length-1)/2) * 18;
      b.x = clamp(paddle.x + paddle.w/2 + spread, paddle.x + b.r, paddle.x + paddle.w - b.r);
      b.y = paddle.y - b.r - 2;
      continue;
    }
    b.x += b.vx * speedMul;
    b.y += b.vy * speedMul;

    if (b.x - b.r < 0){ b.x = b.r; b.vx *= -1; sfx.wall(); }
    if (b.x + b.r > GAME_W){ b.x = GAME_W - b.r; b.vx *= -1; sfx.wall(); }
    if (b.y - b.r < 0){ b.y = b.r; b.vy *= -1; sfx.wall(); }

    // paddle
    if (b.vy > 0 && b.y + b.r >= paddle.y && b.y + b.r <= paddle.y + paddle.h + 8 &&
        b.x >= paddle.x - b.r && b.x <= paddle.x + paddle.w + b.r){
      if (magnetTimer > 0){
        b.stuck = true;
        b.vx = 0; b.vy = 0;
        sfx.paddle();
      } else {
        const hitPos = clamp((b.x - (paddle.x + paddle.w/2)) / (paddle.w/2), -1, 1);
        const angle = hitPos * (Math.PI/3); // up to 60deg
        b.vx = currentSpeed * Math.sin(angle);
        b.vy = -Math.abs(currentSpeed * Math.cos(angle));
        b.y = paddle.y - b.r - 1;
        sfx.paddle();
      }
    }

    // trampoline: safety net near the bottom edge — bounces a missed ball back up
    if (trampolineTimer > 0 && b.vy > 0 && b.y + b.r >= GAME_H - 6){
      b.y = GAME_H - 6 - b.r;
      b.vy = -Math.abs(b.vy);
      sfx.wall();
    }

    // bricks
    for (let j = bricks.length-1; j>=0; j--){
      const br = bricks[j];
      if (!br.alive) continue;
      if (ballBrickCollide(b, br)){
        const piercing = fireTimer > 0;
        if (!piercing) resolveBrickHit(b, br);
        br.hp--;
        sfx.brick(br.hp>0);
        if (br.hp <= 0){
          br.alive = false;
          spawnParticles(br.x+br.w/2, br.y+br.h/2, br.color);
          addScore(br.maxHp > 1 ? 20 : 10);
          maybeDropPower(br.x+br.w/2, br.y+br.h/2);
        } else {
          addScore(5);
        }
        if (!piercing) break;
      }
    }

    // fell below
    if (b.y - b.r > GAME_H){
      balls.splice(i,1);
    }
  }

  // powerups falling
  for (let i = powerups.length-1; i>=0; i--){
    const p = powerups[i];
    p.y += p.vy;
    if (p.y > paddle.y - 4 && p.y < paddle.y + paddle.h &&
        p.x > paddle.x - 10 && p.x < paddle.x + paddle.w + 10){
      applyPower(p);
      powerups.splice(i,1);
      continue;
    }
    if (p.y > GAME_H + 20) powerups.splice(i,1);
  }

  // gun powerup: auto-fire at bricks
  if (gunTimer > 0){
    gunTimer = Math.max(0, gunTimer - dt);
    gunCooldown -= dt;
    if (gunCooldown <= 0){
      gunCooldown = 270;
      if (widenTimer > 0){
        bullets.push({ x: paddle.x + 8, y: paddle.y, vy: -7 });
        bullets.push({ x: paddle.x + paddle.w - 8, y: paddle.y, vy: -7 });
      } else {
        bullets.push({ x: paddle.x + paddle.w/2, y: paddle.y, vy: -7 });
      }
    }
  }

  for (let i = bullets.length-1; i>=0; i--){
    const bl = bullets[i];
    bl.y += bl.vy;
    let hit = false;
    for (let j = bricks.length-1; j>=0; j--){
      const br = bricks[j];
      if (!br.alive) continue;
      if (bl.x > br.x && bl.x < br.x+br.w && bl.y > br.y && bl.y < br.y+br.h){
        br.hp--;
        sfx.brick(br.hp>0);
        if (br.hp <= 0){
          br.alive = false;
          spawnParticles(br.x+br.w/2, br.y+br.h/2, br.color);
          addScore(br.maxHp > 1 ? 15 : 8);
          maybeDropPower(br.x+br.w/2, br.y+br.h/2);
        } else {
          addScore(4);
        }
        hit = true;
        break;
      }
    }
    if (hit || bl.y < -10) bullets.splice(i,1);
  }

  updateParticles();

  // lost all balls
  if (balls.length === 0){
    lives--;
    updateHud();
    if (lives <= 0){
      endGame(false);
    } else {
      resetPaddleAndBall();
      sfx.lose();
      showToast('💥 איבדת חיים');
    }
    return;
  }

  // level clear
  if (bricks.every(br => !br.alive)){
    levelUp();
  }
}

function levelUp(){
  state = 'levelup';
  sfx.win();
  addScore(50);
  level++;
  const gotLife = lives < 3;
  lives = Math.min(3, lives + 1);
  updateHud();
  document.getElementById('lvTitle').textContent = 'שלב ' + level + ' 🎉';
  document.getElementById('lvSub').textContent = gotLife
    ? 'המהירות עולה — וקיבלתם חיים נוסף 💗'
    : 'המהירות עולה — תתחילו כשתהיו מוכנים!';
  ovLevel.classList.remove('hidden');
  buildLevel(level);
  resetPaddleAndBall();
}

function endGame(won){
  state = 'over';
  sfx.over();
  const best = Math.max(getBest(), score);
  setBest(best);
  updateHud();
  document.getElementById('overTitle').textContent = 'המשחק נגמר 💥';
  document.getElementById('overSub').textContent = 'ניקוד סופי: ' + score + ' · שלב ' + level;
  ovOver.classList.remove('hidden');
  if (window.Leaderboard){
    (Leaderboard.gameOverIn
      ? Leaderboard.gameOverIn(1000, score, { level })
      : setTimeout(function(){ Leaderboard.gameOver(score, { level }); }, 1000));
  }
}

/* ---------- render ---------- */
function draw(){}
const BUFF_META = {
  wide: { emoji:'↔️' }, slow: { emoji:'🐢' }, gun: { emoji:'🔫' }, fire: { emoji:'🔥' },
  trampoline: { emoji:'🛝' }, magnet: { emoji:'🧲' }
};
function updateBuffBar(){
  const active = { wide: widenTimer, slow: slowTimer, gun: gunTimer, fire: fireTimer, trampoline: trampolineTimer, magnet: magnetTimer };
  Object.keys(active).forEach(key=>{
    const t = active[key];
    let el = buffBarEl.querySelector('.buff-' + key);
    if (t > 0){
      if (!el){
        el = document.createElement('div');
        el.className = 'buff buff-' + key;
        el.innerHTML = '<span class="ico">' + BUFF_META[key].emoji + '</span><span class="secs"></span><span class="bar"><i></i></span>';
        buffBarEl.appendChild(el);
      }
      el.querySelector('.secs').textContent = Math.ceil(t / 1000) + 's';
      const pct = Math.max(0, Math.min(100, (t / 10000) * 100));
      el.querySelector('.bar i').style.width = pct + '%';
    } else if (el){
      el.remove();
    }
  });
}

function render(){
  updateBuffBar();
  ctx.clearRect(0,0,GAME_W,GAME_H);

  // background subtle grid
  const isDark = isDarkTheme();
  ctx.fillStyle = isDark ? '#161a30' : '#ffffff';
  ctx.fillRect(0,0,GAME_W,GAME_H);

  // bricks
  bricks.forEach(br=>{
    if (!br.alive) return;
    ctx.globalAlpha = br.hp < br.maxHp ? 0.6 : 1;
    ctx.fillStyle = br.color;
    roundRect(br.x, br.y, br.w, br.h, 4);
    ctx.fill();
    if (br.maxHp > 1 && br.hp > 0){
      ctx.strokeStyle = 'rgba(0,0,0,.25)';
      ctx.lineWidth = 2;
      roundRect(br.x+1, br.y+1, br.w-2, br.h-2, 3);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  });

  // powerups
  powerups.forEach(p=>{
    ctx.font = '16px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, 10, 0, Math.PI*2); ctx.fill();
    ctx.fillText(p.emoji, p.x, p.y+1);
  });

  // trampoline safety net
  if (trampolineTimer > 0){
    ctx.save();
    ctx.strokeStyle = '#4ecdc4';
    ctx.lineWidth = 3;
    ctx.setLineDash([8,6]);
    ctx.beginPath();
    ctx.moveTo(0, GAME_H - 6);
    ctx.lineTo(GAME_W, GAME_H - 6);
    ctx.stroke();
    ctx.restore();
  }

  // paddle
  if (magnetTimer > 0){
    ctx.save();
    ctx.shadowColor = '#a78bfa';
    ctx.shadowBlur = 10;
    ctx.fillStyle = isDark ? '#f0eefc' : '#1c1730';
    roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 6);
    ctx.fill();
    ctx.restore();
  } else {
    ctx.fillStyle = isDark ? '#f0eefc' : '#1c1730';
    roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 6);
    ctx.fill();
  }

  // bullets
  ctx.fillStyle = '#ffa64a';
  bullets.forEach(bl=>{
    roundRect(bl.x-2, bl.y-9, 4, 11, 2); ctx.fill();
  });

  // balls
  balls.forEach(b=>{
    ctx.fillStyle = fireTimer > 0 ? '#ff6b35' : '#ff5ca8';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2); ctx.fill();
    if (fireTimer > 0){
      ctx.strokeStyle = 'rgba(255,180,80,.7)';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r+2.5, 0, Math.PI*2); ctx.stroke();
    }
    if (b.stuck && state === 'playing'){
      ctx.fillStyle = isDark ? '#9a94c2' : '#726b95';
      ctx.font = '11px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('גררו למקם ושחררו לשיגור ⬆️', b.x, b.y - 16);
    }
  });

  drawParticles();

  if (state === 'idle'){
    // faint preview bricks already drawn via buildLevel(1) call below on init
  }
}

function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

/* ---------- init ---------- */
buildLevel(1);
resetPaddleAndBall();
resizeCanvas();
requestAnimationFrame(loop);

})();
</script>
